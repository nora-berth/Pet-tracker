name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-unit-integration-tests:
    uses: ./.github/workflows/backend-unit-integration-tests.yml
    secrets: inherit

  frontend-unit-tests:
    uses: ./.github/workflows/frontend-unit-tests.yml
    secrets: inherit

  api-integration-tests:
    uses: ./.github/workflows/api-integration-tests.yml
    secrets: inherit

  e2e-tests:
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit

  ci-gate:
    name: Build & Test
    runs-on: ubuntu-latest
    if: always()
    needs: [backend-unit-integration-tests, frontend-unit-tests, e2e-tests, api-integration-tests]

    steps:
      - name: Check test results
        run: |
          echo "Backend Unit & Integration Tests: ${{ needs.backend-unit-integration-tests.result }}"
          echo "Frontend Unit Tests: ${{ needs.frontend-unit-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "API Integration Tests: ${{ needs.api-integration-tests.result }}"

          if [[ "${{ needs.backend-unit-integration-tests.result }}" != "success" || \
                "${{ needs.frontend-unit-tests.result }}" != "success" || \
                "${{ needs.e2e-tests.result }}" != "success" || \
                "${{ needs.api-integration-tests.result }}" != "success" ]]; then
            echo "One or more test layers failed."
            exit 1
          fi

          echo "All test layers passed."
