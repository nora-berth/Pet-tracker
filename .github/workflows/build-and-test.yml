name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pytest-tests:
    uses: ./.github/workflows/pytest-tests.yml
    secrets: inherit

  vitest-tests:
    uses: ./.github/workflows/vitest-tests.yml
    secrets: inherit

  newman-tests:
    uses: ./.github/workflows/newman-tests.yml
    secrets: inherit

  playwright-tests:
    uses: ./.github/workflows/playwright-tests.yml
    secrets: inherit

  ci-gate:
    name: Build & Test
    runs-on: ubuntu-latest
    if: always()
    needs: [pytest-tests, vitest-tests, playwright-tests, newman-tests]

    steps:
      - name: Check test results
        run: |
          echo "Backend Tests: ${{ needs.pytest-tests.result }}"
          echo "Frontend Tests: ${{ needs.vitest-tests.result }}"
          echo "E2E Tests: ${{ needs.playwright-tests.result }}"
          echo "API Tests: ${{ needs.newman-tests.result }}"

          if [[ "${{ needs.pytest-tests.result }}" != "success" || \
                "${{ needs.vitest-tests.result }}" != "success" || \
                "${{ needs.playwright-tests.result }}" != "success" || \
                "${{ needs.newman-tests.result }}" != "success" ]]; then
            echo "One or more test layers failed."
            exit 1
          fi

          echo "All test layers passed."
